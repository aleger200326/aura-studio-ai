services:
  postgres:
    image: postgres:16-alpine
    container_name: aura_studio_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_password
      POSTGRES_DB: aura_studio
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_studio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aura_pgdata:
